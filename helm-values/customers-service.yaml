nameOverride: customers-service

component: service

image:
  repository: petclinic/customers-service

service:
  port: 8081

configMap:
  data:
    SPRING_PROFILES_ACTIVE: "docker,mysql"
    CONFIG_SERVER_URL: "http://config-server:8888"
    SPRING_DATASOURCE_URL: "jdbc:mysql://petclinic-shared-mysql.cglctcznlizm.eu-central-1.rds.amazonaws.com:3306/petclinic"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "2"
    MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://tracing-server:9411/api/v2/spans"
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo "waiting for config-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo "waiting for discovery-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true

env:
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: rds-credentials
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: rds-credentials
        key: password

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
