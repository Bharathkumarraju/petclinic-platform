nameOverride: discovery-server

component: server

image:
  repository: petclinic/discovery-server

service:
  port: 8761

configMap:
  data:
    SPRING_PROFILES_ACTIVE: "docker"
    CONFIG_SERVER_URL: "http://config-server:8888"

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo "waiting for config-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# discovery-server does NOT have micrometer-registry-prometheus — scraping /actuator/prometheus returns 404
serviceMonitor:
  enabled: false
