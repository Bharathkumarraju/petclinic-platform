nameOverride: admin-server

component: admin

image:
  repository: petclinic/admin-server

service:
  port: 9090

configMap:
  data:
    SPRING_PROFILES_ACTIVE: "docker"
    CONFIG_SERVER_URL: "http://config-server:8888"

initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://config-server:8888/actuator/health; do echo "waiting for config-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
  - name: wait-for-discovery-server
    image: busybox:1.36
    command: ['sh', '-c', 'until wget -qO- http://discovery-server:8761/actuator/health; do echo "waiting for discovery-server"; sleep 5; done']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true

# Admin dashboard — no autoscaling, single instance is sufficient
autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# admin-server does NOT have micrometer-registry-prometheus — scraping /actuator/prometheus returns 404
serviceMonitor:
  enabled: false
