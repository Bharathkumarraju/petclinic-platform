# Applied once per cluster; MESH_NAMESPACE is substituted by apply-eso.sh
# Results in a K8s Secret named "rds-credentials" with keys:
#   username, password, host, port, dbname
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: MESH_NAMESPACE
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: petclinic/shared/rds-credentials
